# Maps the secret id used by the workflow (runtime.getSecret({ id })) to the env var(s) holding the value.
# For simulation the value is read from the environment / .env file (see .env.example).
secretsNames:
  ESCROW_SECRET_KEY:
    - ESCROW_SECRET_KEY_ENV
  # Arkiv RPC access key (not strictly secret, but kept out of git). Read from the process env.
  ARKIV_ACCESS_KEY:
    - ARKIV_ACCESS_KEY
